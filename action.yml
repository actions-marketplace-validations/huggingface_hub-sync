name: Sync GitHub to Hugging Face Hub
description: Sync a GitHub repository to the Hugging Face Hub using the hf CLI
author: huggingface
branding:
  icon: upload-cloud
  color: yellow

inputs:
  github_repo_id:
    required: true
    description: 'GitHub repository ID (owner/repo)'
  subdirectory:
    required: false
    description: 'Subdirectory to sync (optional, defaults to root)'
    default: ''
  huggingface_repo_id:
    required: true
    description: 'Hugging Face repository ID (owner/repo)'
  hf_token:
    required: true
    description: 'Hugging Face API token'
  repo_type:
    required: false
    description: 'Repository type (model, dataset, or space)'
    default: 'space'
  space_sdk:
    required: false
    description: 'Space SDK (gradio, streamlit, docker, or static) - only used when repo_type is space'
    default: 'gradio'
  private:
    required: false
    description: 'Whether the repository should be private'
    default: 'false'
  exclude:
    required: false
    description: 'Extra glob patterns to exclude, one per line. Root .git* and any nested .git/ or .github/ are always excluded.'
    default: ''
  include:
    required: false
    description: 'Glob patterns to upload, one per line. If set, only matching files are uploaded.'
    default: ''
  delete_removed:
    required: false
    description: 'Delete Hub files that are outside the upload set. Set to false to leave them untouched.'
    default: 'true'
  hf_version:
    required: false
    description: 'hf CLI package version to pin. Leave unset to install the latest published version.'

runs:
  using: composite
  steps:
    - name: Set up uv
      uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      with:
        # 'auto' is setup-uv's v10 default: caches, minus cache-poisoning-prone events
        enable-cache: auto

    - name: Sync to Hugging Face
      shell: bash
      env:
        GITHUB_REPO_ID: ${{ inputs.github_repo_id }}
        HF_REPO_ID: ${{ inputs.huggingface_repo_id }}
        HF_TOKEN: ${{ inputs.hf_token }}
        REPO_TYPE: ${{ inputs.repo_type }}
        PRIVATE: ${{ inputs.private }}
        SPACE_SDK: ${{ inputs.space_sdk }}
        SUBDIRECTORY: ${{ inputs.subdirectory }}
        EXCLUDE_PATTERNS: ${{ inputs.exclude }}
        INCLUDE_PATTERNS: ${{ inputs.include }}
        DELETE_REMOVED: ${{ inputs.delete_removed }}
        HF_VERSION: ${{ inputs.hf_version }}
      run: |
        set -euo pipefail

        if [[ "${DELETE_REMOVED}" != "true" && "${DELETE_REMOVED}" != "false" ]]; then
          echo "::error::delete_removed must be 'true' or 'false', got '${DELETE_REMOVED}'"
          exit 1
        fi

        # Resolve the hf CLI invocation. If hf_version is set, pin the dedicated
        # hf package to that version; otherwise install the latest published version.
        if [[ -n "${HF_VERSION}" ]]; then
          HF=(uvx "hf@${HF_VERSION}")
        else
          HF=(uvx hf)
        fi

        # Log the resolved hf CLI version so CI logs record exactly which
        # version ran (useful for debugging when the CLI is left unpinned).
        echo "::group::hf CLI version"
        "${HF[@]}" version
        echo "::endgroup::"

        echo "::group::Syncing GitHub repo to Hugging Face"
        echo "Source repo ID: ${GITHUB_REPO_ID}"
        echo "Hugging Face repo ID: ${HF_REPO_ID}"
        echo "Repo type: ${REPO_TYPE}"
        echo "Private: ${PRIVATE}"
        if [[ "${REPO_TYPE}" == "space" ]]; then
          echo "Space SDK: ${SPACE_SDK}"
        fi
        if [[ -n "${SUBDIRECTORY}" ]]; then
          echo "Subdirectory: ${SUBDIRECTORY}"
        fi
        echo "Delete removed files: ${DELETE_REMOVED}"
        if [[ -n "${INCLUDE_PATTERNS//[[:space:]]/}" ]]; then
          echo "Include patterns: $(echo "${INCLUDE_PATTERNS}" | paste -sd' ' -)"
        fi
        if [[ -n "${EXCLUDE_PATTERNS//[[:space:]]/}" ]]; then
          echo "Extra exclude patterns: $(echo "${EXCLUDE_PATTERNS}" | paste -sd' ' -)"
        fi
        echo "::endgroup::"

        # Build create command
        echo "::group::Creating or updating Hugging Face repo"
        CREATE_CMD=("${HF[@]}" repos create "${HF_REPO_ID}" --type "${REPO_TYPE}" --exist-ok)

        if [[ "${PRIVATE}" == "true" ]]; then
          CREATE_CMD+=(--private)
        fi
        
        if [[ "${REPO_TYPE}" == "space" ]]; then
          CREATE_CMD+=(--space-sdk "${SPACE_SDK}")
        fi
        
        # Note: We don't pass the token via command line to avoid it appearing in logs
        # Instead, we'll use HF_TOKEN environment variable which huggingface_hub respects
        "${CREATE_CMD[@]}"
        echo "::endgroup::"
        
        # Determine source directory
        SRC_DIR="."
        if [[ -n "${SUBDIRECTORY}" ]]; then
          if [[ ! -d "${SUBDIRECTORY}" ]]; then
            echo "::error::Subdirectory '${SUBDIRECTORY}' does not exist"
            exit 1
          fi
          SRC_DIR="${SUBDIRECTORY}"
          echo "Using subdirectory: ${SRC_DIR}"
        fi
        
        # Rough pre-flight count, the real filtering happens in hf upload below
        FILE_COUNT=$(find "${SRC_DIR}" -type f ! -path '*/.git/*' ! -path '*/.github/*' | wc -l | tr -d ' ')
        
        if [[ ${FILE_COUNT} -eq 0 ]]; then
          echo "::error::No files to upload. Check that your repository has files."
          exit 1
        fi
        
        # Always enforced: root git metadata, plus git and CI directories nested anywhere.
        EXCLUDE_ARGS=(--exclude=".git*" --exclude="*/.git/" --exclude="*/.github/")
        USER_EXCLUDES=0
        while read -r pattern; do
          [[ -z "${pattern}" || "${pattern}" == \#* ]] && continue
          EXCLUDE_ARGS+=(--exclude="${pattern}")
          USER_EXCLUDES=$((USER_EXCLUDES + 1))
        done <<< "${EXCLUDE_PATTERNS}"

        # An allowlist: when non-empty, only matching files are uploaded.
        INCLUDE_ARGS=()
        while read -r pattern; do
          [[ -z "${pattern}" || "${pattern}" == \#* ]] && continue
          INCLUDE_ARGS+=(--include="${pattern}")
        done <<< "${INCLUDE_PATTERNS}"

        # Upload contents directly (true mirror)
        # hf upload works over HTTP, no local git repo or staging needed
        UPLOAD_CMD=("${HF[@]}" upload "${HF_REPO_ID}" "${SRC_DIR}" --type "${REPO_TYPE}")
        UPLOAD_CMD+=("${EXCLUDE_ARGS[@]}")

        # Guard the expansion: bash 3.2 errors on an empty array under `set -u`.
        if [[ ${#INCLUDE_ARGS[@]} -gt 0 ]]; then
          UPLOAD_CMD+=("${INCLUDE_ARGS[@]}")
        fi

        if [[ "${DELETE_REMOVED}" == "true" ]]; then
          # hf deletes every Hub file outside the upload set, filtered files included.
          if [[ ${USER_EXCLUDES} -gt 0 || ${#INCLUDE_ARGS[@]} -gt 0 ]]; then
            echo "::warning::Files filtered out by your include/exclude patterns will be DELETED from the Hub. Set delete_removed: false to leave them in place."
          fi
          UPLOAD_CMD+=(--delete="*")
        fi

        UPLOAD_CMD+=(--commit-message="Sync from ${GITHUB_REPO_ID} via hub-sync")

        echo "::group::Uploading to Hugging Face"
        echo "Uploading from ${SRC_DIR} (${FILE_COUNT} files before include/exclude filtering)..."
        "${UPLOAD_CMD[@]}"
        echo "::endgroup::"
        
        # Build the correct HF URL based on repo type:
        # model: https://huggingface.co/{owner}/{repo}
        # dataset: https://huggingface.co/datasets/{owner}/{repo}
        # space: https://huggingface.co/spaces/{owner}/{repo}
        if [[ "${REPO_TYPE}" == "model" ]]; then
          HF_URL="https://huggingface.co/${HF_REPO_ID}"
        else
          HF_URL="https://huggingface.co/${REPO_TYPE}s/${HF_REPO_ID}"
        fi
        
        echo "Sync completed successfully"
        echo "View at: ${HF_URL}"
